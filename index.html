    <meta property="og:type" content="website">
    <meta property="og:title" content="Iniciar sesión | Athletic People Gym">
    <meta property="og:description" content="Pantalla de acceso al área de socios de Athletic People Gym. Entra con tu correo y tu contraseña. Demo de interfaz responsive, sin servidor de autenticación.">
    <meta property="og:url" content="https://athleticpeoplegym.wib.digital/">
    <meta property="og:image" content="https://athleticpeoplegym.wib.digital/assets/img/content/og-cover.png">

    <meta name="theme-color" content="#0d0d0d">
    <link rel="icon" href="assets/img/logo/favicon.png" sizes="32x32" type="image/png">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <script defer src="assets/js/modules/auth-form.js"></script>
    <script defer src="assets/js/main.js"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Pablo Nieto Pérez",

  </head>

  <body>
    <main class="stage">
      <div class="card">
        <header class="brand">
          <img class="brand__mark" src="assets/img/logo/athletic-people-logo.webp" alt="" width="80" height="80">
          <p class="brand__kicker">Gym</p>
          <p class="brand__name">Athletic People</p>
        </header>

        <section class="auth">
          <div class="auth__heading">
            <h1>Iniciar sesión</h1>
            <p class="auth__subtitle">Entra al área de socios con tu correo y tu contraseña.</p>
          </div>

          <form class="auth__form" data-auth-form novalidate>
            <div class="field">
              <label class="field__label" for="email">Correo electrónico</label>
              <input
                class="field__input"
                id="email"
                type="email"
                name="email"
                autocomplete="email"
                inputmode="email"
                placeholder="nombre@dominio.com"
                aria-describedby="email-error"
                data-auth-field
                required>
              <span class="field__error" id="email-error" role="alert" hidden></span>
            </div>

            <div class="field">
              <label class="field__label" for="password">Contraseña</label>
              <input
                class="field__input"
                id="password"
                type="password"
                name="password"
                autocomplete="current-password"
                minlength="8"
                aria-describedby="password-error"
                data-auth-field
                required>
              <span class="field__error" id="password-error" role="alert" hidden></span>
            </div>

            <p class="status" data-auth-status role="status" hidden></p>

            <button class="button button--block" type="submit" data-auth-submit>Entrar</button>
          </form>

          <p class="auth__note">Demo de interfaz. No hay servidor de autenticación conectado: lo que escribas se valida en tu navegador y no se envía a ningún sitio.</p>
        </section>
      </div>
    </main>
  </body>
</html>
